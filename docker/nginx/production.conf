# Production Nginx reverse proxy configuration for ArifDrop
upstream arifdrop_app {
    server web:3000;
    keepalive 32;
    keepalive_timeout 15s;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Allow ACME challenge / certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # SSL configuration (certificates mounted from host/secrets)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /app/public;
    client_max_body_size 50M;

    # Health check endpoints - pass directly to upstream
    location ~ ^/(up|health)$ {
        proxy_pass http://arifdrop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # Chapa Webhook Delivery - unbuffered, immediate streaming
    location = /webhooks/chapa {
        proxy_pass http://arifdrop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering so gateway confirmations process with zero delay
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 5M;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Static assets caching (Vite and Sprockets assets)
    location ~ ^/(assets|vite)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @app;
    }

    # Public static files (favicon, robots, etc.)
    location ~ ^/(favicon\.ico|robots\.txt|pages-tailwind\.css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri @app;
    }

    # Dynamic Rails App Proxy
    location / {
        try_files $uri/index.html $uri @app;
    }

    location @app {
        proxy_pass http://arifdrop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_buffers 16 64k;
        proxy_buffer_size 64k;
        client_body_buffer_size 128k;
    }

    error_page 500 502 503 504 /500.html;
}
